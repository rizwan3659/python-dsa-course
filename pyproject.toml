[project]
name = "python-dsa-lab"
version = "0.2.0"
description = "Hands-on data structures and algorithms in Python: browser course plus a local pytest practice track."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
